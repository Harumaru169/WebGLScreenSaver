name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report and verify build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          selected_version=$(xcodebuild -version | awk '/^Xcode / { print $2 }')
          [[ "$selected_version" == 27.0 ]] || {
            echo 'Expected Xcode 27.0 for the current Icon Composer asset' >&2
            exit 1
          }
      - name: Build, ad-hoc sign, and verify ZIP
        run: bash scripts/build-release.sh
      - name: Check generated Cask style
        run: brew style dist/webgl-screen-saver.rb
      - name: Confirm tracked source is unchanged
        run: git diff --exit-code HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: WebGLScreenSaver-arm64-${{ github.run_id }}
          path: |
            dist/WebGLScreenSaver-arm64.zip
            dist/SHA256SUMS
            dist/build-info.json
            dist/webgl-screen-saver.rb
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.run_id }}
          path: dist/build.log
          if-no-files-found: ignore
          retention-days: 14
